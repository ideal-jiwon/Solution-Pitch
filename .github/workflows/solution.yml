name: Build and deploy Python app to Azure Web App - SolutionPitch

on:
  push:
    branches:
      - demo-clean
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python version
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          cd restaurant-ai-frontend-typescript
          python -m venv venv
          source venv/bin/activate
          pip install -r requirements.txt

      - name: Zip artifact for deployment
        run: |
          zip -r release.zip restaurant-ai-frontend-typescript -x "**/venv/**" "**/.git/**" "**/__pycache__/**"
        

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: release.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'Production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: python-app

      - name: Unzip artifact
        run: unzip release.zip
      
      - name: Verify ZIP contents
        run: unzip -l release.zip | grep server.py

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_97EA6B78D51D45D6B71730F964F07EC4 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_CAB3F21D62D04C0AB968731B637F0F64 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_50953A9AF24349B4A03908459DA4F5D3 }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: 'SolutionPitch'
          slot-name: 'Production'
          package: release.zip
